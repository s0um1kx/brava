<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Brava</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F1210" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="capture-screen">
    <header class="brand">
      <span class="brand-mark">brava</span>
    </header>

    <section class="capture-core">
      <button id="capture-btn" class="capture-btn" aria-label="Start capturing a thought">
        <span class="capture-btn-inner"></span>
      </button>
      <p id="status-line" class="status-line">Tap to speak</p>
    </section>

    <footer class="footer-note">
      <span id="build-tag">v0.1 — skeleton</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
